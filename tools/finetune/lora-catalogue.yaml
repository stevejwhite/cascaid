# LoRA settings for run 6 (catalogue stations; run 3 recipe, more data). Paths come from train.sh.
fine_tune_type: lora
train: true
mask_prompt: true          # learn the answer, not the (long) topic list
batch_size: 8
iters: 2000                # about 1.1 epochs of ~15,000 lines (run 6: catalogue stations)
learning_rate: 1.0e-4
num_layers: 16
max_seq_length: 1024
steps_per_report: 25
steps_per_eval: 500
save_every: 500
grad_checkpoint: true          # needed with all servers running (run 4 ran out of GPU memory without it)
seed: 0
lora_parameters:
  rank: 16
  scale: 20.0
  dropout: 0.0
