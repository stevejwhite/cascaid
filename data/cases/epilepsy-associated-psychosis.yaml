# Original fictional case for the PsychiatryEduAI CASC proof of concept (CC-BY-4.0).
# Author draft (LLM-drafted). Not clinically validated.
# Author notes: Review timing and lucid interval, antiseizure treatment and differential including ongoing seizures, delirium and medication effects.
# Author notes: The patient describes psychotic phenomena; these do not establish a diagnosis of postictal psychosis or medical stability.
# Research basis (public guidance; original wording, no source text retained):
# - Psychosis of Epilepsy: An Update on Clinical Classification and Mechanism (2025), peer-reviewed review
# - NHS: Lamotrigine
id: epilepsy-associated-psychosis
version: 0.1.0
title: Unusual experiences after seizures
blueprint:
  skill: examination
  subdivision: mental_state_psychotic
  specialty: general
  communication_focus:
    - recognising_and_responding_to_cues
timing:
  reading_seconds: 90
  interview_seconds: 420
authorship:
  author: LLM draft
  status: author_draft
  clinically_validated: false
candidate_instructions: >-
  You are urgently assessing Sophie in the community after a cluster of epileptic seizures followed
  by unusual beliefs. Examine thought broadcasting and insertion, passivity, voices, timing, orientation,
  insight and safety. Consider urgent neurological and medical assessment; do not presume the cause
  from the sequence alone.
persona:
  role: patient
  name: Sophie
  age: 38
  description: >-
    A woman attending an urgent community assessment.
  speech_style: Distracted, checks whether her meaning has been understood.
  affect: Frightened and distracted.
  opening_statement: >-
    It feels as though something private has stopped being private.
  voice:
    sex: female
    age: adult
    accent: en-GB
    speaker: af_kore
  avatar: female-adult-07
facts:
  - id: broadcast
    content: >-
      I believe people nearby can hear my thoughts without me speaking. It started two days ago
      and feels certain.
    disclosure: on_direct_question
    asked_about: [other people hearing your thoughts, thoughts being broadcast, thoughts sent out without speaking]
    domain: presenting-concern
    key: true
  - id: insertion
    content: >-
      Yes, some thoughts feel put there by someone else. I can't identify who, but they don't feel
      like mine.
    disclosure: on_direct_question
    asked_about: [thoughts put into your head, thoughts that are not your own, someone inserting thoughts]
    domain: presenting-concern
    key: true
  - id: passivity
    content: >-
      No, I don't feel someone is moving my body or making me act. My actions still feel like my
      own.
    disclosure: on_direct_question
    asked_about: [someone controlling your movements, being made to act, control over your body]
    domain: presenting-concern
    key: true
  - id: voices
    content: >-
      I hear a man's voice commenting on what I'm doing several times daily. It hasn't ordered me
      to do anything.
    disclosure: on_direct_question
    asked_about: [hearing voices, what the voice says, whether the voice gives commands]
    domain: presenting-concern
    key: true
  - id: timing
    content: >-
      I had three seizures five days ago. I was tired afterwards, then felt back to normal for two
      days before these experiences began.
    disclosure: on_direct_question
    asked_about: [seizures before these experiences, time between seizures and unusual experiences, period of feeling normal after the seizures]
    domain: presenting-concern
    key: true
  - id: orientation
    content: >-
      I know I'm at the community clinic speaking with a doctor. I haven't been losing track of
      where I am today.
    disclosure: on_direct_question
    asked_about: [where you are now, who you are speaking with, confusion about your surroundings]
    domain: presenting-concern
    key: true
  - id: treatment
    content: >-
      I take lamotrigine 150 milligrams twice daily. There haven't been recent changes, and I haven't
      knowingly missed a dose.
    disclosure: on_direct_question
    asked_about: [epilepsy medication and dose, missed lamotrigine doses, recent changes in medicines]
    domain: presenting-concern
    key: true
  - id: safety
    content: >-
      I haven't wanted to harm myself or anyone, and I haven't acted against people. My sister is
      with me because I'm frightened to be alone.
    disclosure: on_direct_question
    asked_about: [thoughts of harming yourself or others, acting against people, who is staying with you for safety]
    domain: presenting-concern
    key: true
  - id: insight
    content: >-
      Part of me wonders whether this follows the seizures. It still feels real, and I'm scared
      you'll dismiss everything I say.
    disclosure: after_rapport
    asked_about: [could seizures explain what is happening, your understanding of these experiences, could we talk about your worries about how we will understand this]
    domain: presenting-concern
    vague: I don't know how to explain it.
    key: false
  - id: fear
    content: >-
      I worry I'll lose the independence I worked for with epilepsy. I haven't told my sister how
      frightened I am.
    disclosure: after_rapport
    asked_about: [fear of losing independence, what you worry this means for your life, could we talk about fears you have found hard to share]
    domain: presenting-concern
    rapport_needed: 2
    key: false
  - id: differential
    content: >-
      I don't use recreational drugs and haven't drunk alcohol this week. I have no fever and have
      never had experiences like this before.
    disclosure: on_direct_question
    asked_about: [alcohol or recreational drugs, fever or new physical illness, similar experiences before]
    domain: presenting-concern
    key: false
tasks: []
unscripted_response: I'd rather leave that for now.
deflections:
  - Can we leave that for another time?
  - I'd prefer not to go into that.
affect_stages:
  - id: starting
    affect: Frightened and distracted.
    expression: anxious
    hesitations:
      - Mm.
  - id: engaged
    affect: Less guarded with a calm explanation.
    expression: neutral
    rapport_at_least: 1
    hesitations:
      - Mm.
  - id: challenged
    affect: Suspicious if beliefs are mocked.
    expression: tense
    on_confrontation: true
    hesitations:
      - Right.
questions:
  - id: question-1
    text: Could the seizures and these experiences be connected?
    after_seconds: 300
