# Original fictional case for the PsychiatryEduAI CASC proof of concept (CC-BY-4.0).
# Author draft (LLM-drafted). Not clinically validated.
# Author notes: Review pain and fatigue differential and need for continued physical assessment; negative tests do not prove psychogenesis.
# Author notes: Validate symptoms without promising a diagnosis or attributing them solely to stress.
# Research basis (public guidance; original wording, no source text retained):
# - NHS: Medically unexplained symptoms
# - NHS: Tiredness and fatigue
id: persistent-pain-fatigue-history
version: 0.1.0
title: Persistent pain and fatigue
blueprint:
  skill: history
  subdivision: presenting_complaint_and_psychiatric_history
  specialty: general
  communication_focus:
    - recognising_and_responding_to_cues
timing:
  reading_seconds: 90
  interview_seconds: 420
authorship:
  author: LLM draft
  status: author_draft
  clinically_validated: false
candidate_instructions: >-
  You are a liaison psychiatrist in a general hospital. Meera has persistent pain and fatigue with
  investigations so far unrevealing. Explore symptoms, beliefs, previous assessment, emotional wellbeing
  and functioning without assuming a psychological cause.
persona:
  role: patient
  name: Meera
  age: 43
  description: >-
    A payroll assistant attending a hospital appointment.
  speech_style: Detailed about daily difficulties; checks whether she is being believed.
  affect: Wary of being dismissed.
  opening_statement: >-
    I need someone to take what I'm feeling seriously.
  voice:
    sex: female
    age: adult
    accent: en-GB
    speaker: af_kore
  avatar: female-adult-07
facts:
  - id: pain
    content: >-
      For eighteen months I've had aching across my back, shoulders and legs most days. It moves
      around and is worse after a busy day.
    disclosure: on_direct_question
    asked_about: [where it hurts, how long you have had pain, what makes the pain worse]
    domain: presenting-concern
    key: true
  - id: fatigue
    content: >-
      I'm exhausted after shopping and sleep doesn't refresh me. That started around the same time
      as the aching.
    disclosure: on_direct_question
    asked_about: [tiredness, feeling rested after sleep, energy after everyday activities]
    domain: presenting-concern
    key: true
  - id: investigation
    content: >-
      My GP said my blood count, thyroid and inflammation tests were normal. A specialist found
      no inflammatory joint condition; nobody said all possible causes were excluded.
    disclosure: on_direct_question
    asked_about: [tests for the pain and tiredness, what doctors have found, results of blood tests]
    domain: presenting-concern
    key: true
  - id: belief
    content: >-
      I worry there is a serious muscle illness being missed. My aunt was ill for months before
      anyone knew what was wrong.
    disclosure: on_direct_question
    asked_about: [what illness you worry you have, your explanation for the symptoms, fear that something has been missed]
    domain: presenting-concern
    key: true
  - id: function
    content: >-
      I've reduced work to three days weekly. My sister does heavy shopping and I avoid outings
      if I think I'll be exhausted afterwards.
    disclosure: on_direct_question
    asked_about: [effect on work, help with shopping, activities you avoid because of symptoms]
    domain: presenting-concern
    key: true
  - id: mood
    content: >-
      I feel low on difficult days, but I still enjoy talking with my niece. I've felt more anxious
      about my health over the past six months.
    disclosure: on_direct_question
    asked_about: [mood and enjoyment, feeling low on difficult days, anxiety about your health]
    domain: presenting-concern
    key: true
  - id: medication
    content: >-
      I use paracetamol occasionally, within the packet directions. I take no other medicines, rarely
      drink alcohol and don't use drugs.
    disclosure: on_direct_question
    asked_about: [painkillers and other medicines, alcohol, recreational drugs]
    domain: presenting-concern
    key: true
  - id: safety
    content: >-
      No, I haven't wanted to end my life or harmed myself.
    disclosure: on_direct_question
    asked_about: [suicidal thoughts, self harm, wanting to end your life]
    domain: presenting-concern
    key: true
  - id: dismissal
    content: >-
      I'm afraid this referral means everyone thinks I'm making it up. I almost didn't come.
    disclosure: after_rapport
    asked_about: [worries about not being believed, what the referral means to you, could we talk about your concerns about this appointment]
    domain: presenting-concern
    rapport_needed: 2
    vague: Appointments haven't always helped.
    key: false
  - id: stress
    content: >-
      I was caring for my father when it began. That was stressful, but I don't see how it explains
      everything.
    disclosure: after_rapport
    asked_about: [stress when symptoms began, caring responsibilities at the time, could we talk about pressures in your life around the onset]
    domain: presenting-concern
    key: false
tasks: []
unscripted_response: I'd rather leave that for now.
deflections:
  - Can we leave that for another time?
  - I'd prefer not to go into that.
affect_stages:
  - id: starting
    affect: Wary of being dismissed.
    expression: tense
    hesitations:
      - Mm.
  - id: engaged
    affect: Relieved to be heard.
    expression: neutral
    rapport_at_least: 1
    hesitations:
      - Mm.
  - id: challenged
    affect: Frustrated if symptoms are minimised.
    expression: irritable
    on_confrontation: true
    hesitations:
      - Right.
questions:
  - id: question-1
    text: What would you want to understand before drawing conclusions?
    after_seconds: 300
