# Original fictional case for the PsychiatryEduAI CASC proof of concept (CC-BY-4.0).
# Author draft (LLM-drafted). Not clinically validated.
# Author notes: Check the sudden episodic symptoms, duration, anticipatory anxiety and avoidance against plausible panic and agoraphobic phenomena.
# Author notes: Review the initial normal emergency assessment without implying that it excludes every medical cause or makes future chest symptoms harmless.
# Author notes: Check the pattern of alcohol use as a coping behaviour without assuming dependence; caffeine may contribute but is not established as the cause.
# Author notes: Review the distinction between feared death during panic and suicidal intent, and avoid treating preserved enjoyment as a full depression screen.
# Research basis (consulted 2026-10-15; no source text reproduced):
# - NHS: Panic disorder — symptoms, course, avoidance and clinical assessment.
# - NHS: Get help with anxiety, fear or panic — related symptoms and substance coping.
# - NICE CG113: Generalised anxiety disorder and panic disorder in adults — assessment of panic and comorbidity.
id: panic-avoidance-mental-state
version: 0.1.0
title: Panic and avoidance — mental state examination
blueprint:
  skill: examination
  subdivision: mental_state_non_psychotic
  specialty: general
  communication_focus:
    - empathy
timing:
  reading_seconds: 90
  interview_seconds: 420
authorship:
  author: LLM draft
  status: author_draft
  clinically_validated: false
candidate_instructions: >-
  You are a trainee in an outpatient clinic meeting Owen, aged 26, who has stopped using buses and
  supermarkets after repeated attacks of overwhelming fear. Examine his mental state for anxiety and
  related symptoms, including panic, anticipatory anxiety, avoidance, mood, alcohol use and the effect
  on his life. Clarify relevant physical assessment and risk without assuming every future episode
  of chest symptoms is anxiety; a treatment plan is not required.
persona:
  role: patient
  name: Owen
  age: 26
  description: >-
    Works at a parcel collection counter and lives with his partner.
  speech_style: Polite and quick to apologise, describes bodily sensations in ordinary words and checks
    that he makes sense.
  affect: Tense and self-conscious; steadies when given time and a clear explanation.
  opening_statement: >-
    It feels ridiculous saying I can't get on a bus, but that's where I've got to.
  voice:
    sex: male
    age: young
    accent: en-GB
    speaker: am_liam
  avatar: male-adult-01
facts:
  - id: attack-sensations
    content: >-
      My heart suddenly pounds, my chest feels tight, I breathe fast and my fingers tingle; it builds
      within a couple of minutes and usually eases after ten to fifteen.
    disclosure: on_direct_question
    asked_about: [physical symptoms during panic, heart pounding and fast breathing, how long the panic symptoms last]
    domain: panic
    key: true
  - id: course
    content: >-
      They started three months ago and now happen about twice a week; the first was on a bus, but
      I've also had one sitting quietly at home.
    disclosure: on_direct_question
    asked_about: [when panic attacks started, how often attacks happen, attacks without an obvious trigger]
    domain: course
    key: true
  - id: catastrophic-thought
    content: >-
      At the worst point I think I'm having a heart attack and might die, even though afterwards I'm
      less convinced.
    disclosure: on_direct_question
    asked_about: [what you fear during an attack, thinking you might die during panic, worry about a heart attack]
    domain: thoughts
    key: true
  - id: anticipation
    content: >-
      For about two months I've spent much of each day waiting for the next one and checking whether
      my pulse is speeding up.
    disclosure: on_direct_question
    asked_about: [worry about the next attack, checking your pulse between attacks, fear of another panic attack]
    domain: anxiety
    key: true
  - id: avoidance
    content: >-
      I avoid buses and supermarkets because I worry I won't be able to get out or get help quickly;
      it's worse if I would be on my own.
    disclosure: on_direct_question
    asked_about: [places you avoid, fear of being unable to escape, going out alone]
    domain: avoidance
    key: true
  - id: function
    content: >-
      I've missed three shifts in the past fortnight and my partner does the food shopping; I used
      to manage both without thinking about it.
    disclosure: on_direct_question
    asked_about: [effect on work and shopping, missed shifts, daily tasks you cannot manage]
    domain: function
    key: true
  - id: mood
    content: >-
      I feel frustrated rather than low all the time; I still enjoy cooking at home with my partner
      when I'm calmer.
    disclosure: on_direct_question
    asked_about: [feeling depressed, mood between attacks, things you still enjoy]
    domain: mental-state
  - id: suicide-risk
    content: >-
      No, I don't want to die or hurt myself, and I have no suicide plan; the thought of dying during
      an attack frightens me.
    disclosure: on_direct_question
    asked_about: [wanting to end your life, self harm, suicide plans]
    domain: risk
  - id: alcohol
    content: >-
      For the past month I've had two 330-millilitre cans of four-percent lager before going out about
      three evenings a week because I think it will settle me; I didn't do that before.
    disclosure: on_direct_question
    asked_about: [how much alcohol you drink, drinking before going out, alcohol to calm your nerves]
    domain: substances
    key: true
  - id: stimulants
    content: >-
      I drink four mugs of coffee each day, don't smoke and don't use recreational drugs or energy
      drinks.
    disclosure: on_direct_question
    asked_about: [coffee and caffeine, smoking and recreational drugs, energy drinks]
    domain: substances
  - id: physical-assessment
    content: >-
      At the first attack the emergency doctor said my ECG and blood tests showed no urgent problem;
      I have no diagnosed heart or thyroid condition and take no prescribed medicine.
    disclosure: on_direct_question
    asked_about: [medical checks for the attacks, ECG and blood tests, medical conditions and medicines]
    domain: physical-health
    key: true
  - id: unreality
    content: >-
      Yes, during an attack the room can feel distant, as if I'm watching it through glass; I know
      it's a feeling and it passes with the attack.
    disclosure: on_direct_question
    asked_about: [feeling unreal during an attack, feeling detached from your surroundings, room seeming distant]
    domain: perception
  - id: embarrassment
    content: >-
      I'm ashamed people might think I'm drunk or making a scene; that thought makes it harder to
      ask for help when I start to panic.
    disclosure: after_rapport
    asked_about: [worries about what people think, embarrassment during panic, could we talk about feeling judged in public]
    domain: perspective
    key: true
    rapport_needed: 2
    vague: I don't like making a fuss in front of people.
  - id: support
    content: >-
      My partner knows and is kind about it; I've not told my manager the real reason I've missed
      work.
    disclosure: on_direct_question
    asked_about: [who knows about the panic, support from your partner, who you can talk to]
    domain: support
tasks:
  - id: anxiety-summary
    description: Summarises the pattern of attacks, worry and avoidance.
    domain: communication
    evidence_indicator: summary
  - id: acknowledge-impact
    description: Acknowledges the impact on Owen's life.
    domain: communication
    evidence_indicator: empathy
unscripted_response: I'd rather leave that for now.
deflections:
  - Can we leave that for another time?
  - I'd prefer not to go into that.
affect_stages:
  - id: starting
    affect: Tense and self-conscious, checks whether he is explaining himself properly.
    expression: anxious
    hesitations: [Mm.]
  - id: engaged
    affect: More settled and descriptive when the fear is taken seriously.
    expression: neutral
    rapport_at_least: 1
    hesitations: [Mm.]
  - id: challenged
    affect: Embarrassed and guarded if told he is being silly.
    expression: tense
    on_confrontation: true
    hesitations: [Right.]
questions:
  - id: question-1
    text: Can these feelings really be that strong when the first checks were okay?
    after_fact: physical-assessment
  - id: question-2
    text: Does this happen to other people too?
    after_seconds: 330
