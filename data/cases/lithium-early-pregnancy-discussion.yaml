# Original fictional case for the PsychiatryEduAI CASC proof of concept (CC-BY-4.0).
# Author draft (LLM-drafted). Not clinically validated.
# Author notes: Check lithium dose, monitoring context and individualised maternal/fetal risk discussion; do not imply abrupt stopping or a universally safe alternative.
# Author notes: Review specialist pregnancy, feeding and postnatal relapse planning; the patient supplies concerns, not prescribing advice.
# Research basis (public guidance; original wording, no source text retained):
# - NICE CG192: Antenatal and postnatal mental health
# - NICE CG185: Bipolar disorder
# - NHS: Pregnancy, breastfeeding and fertility while taking lithium
id: lithium-early-pregnancy-discussion
version: 0.1.0
title: Bipolar medication in early pregnancy
blueprint:
  skill: management
  subdivision: management_biological
  specialty: general
  communication_focus:
    - providing_clear_and_accurate_information
timing:
  reading_seconds: 240
  interview_seconds: 420
authorship:
  author: LLM draft
  status: author_draft
  clinically_validated: false
candidate_instructions: >-
  You are seeing Aisha in an outpatient clinic. She has bipolar disorder, is eight weeks pregnant
  and takes lithium. Discuss her concerns, the balance of treatment and relapse risks, and specialist
  planning through pregnancy and after birth; do not give a fixed prescribing instruction.
persona:
  role: patient
  name: Aisha
  age: 32
  description: >-
    An administrator attending a planned clinic appointment.
  speech_style: Careful, practical questions; repeats unfamiliar terms to check them.
  affect: Anxious but seeking a joint decision.
  opening_statement: >-
    I've found out I'm pregnant and need to talk about my medicine.
  voice:
    sex: female
    age: adult
    accent: en-GB
    speaker: af_alloy
  avatar: female-adult-01
facts:
  - id: pregnancy
    content: >-
      Yes, I'm eight weeks pregnant by my dates. My midwife booking is next week.
    disclosure: on_direct_question
    asked_about: [how many weeks pregnant, pregnancy dates, midwife appointment]
    domain: presenting-concern
    key: true
  - id: medicine
    content: >-
      I take lithium carbonate 800 milligrams at night. I've kept taking it every day while waiting
      for advice.
    disclosure: on_direct_question
    asked_about: [lithium dose, how often you take lithium, missed lithium doses]
    domain: presenting-concern
    key: true
  - id: episodes
    content: >-
      I've had two admissions for periods when I barely slept, spent recklessly and felt unstoppable.
      The most recent was three years ago.
    disclosure: on_direct_question
    asked_about: [previous episodes of bipolar illness, psychiatric admissions, past periods of high mood]
    domain: presenting-concern
    key: true
  - id: withdrawal-history
    content: >-
      Yes, I stopped lithium on my own before that last admission. Within six weeks I was becoming
      unwell.
    disclosure: on_direct_question
    asked_about: [what happened when you stopped lithium, relapse after stopping medication, previous breaks in lithium treatment]
    domain: presenting-concern
    key: true
  - id: baby-fear
    content: >-
      I'm scared I've already harmed the baby by taking it before I knew I was pregnant. I'm ashamed
      to say that out loud.
    disclosure: after_rapport
    asked_about: [worries about lithium harming the baby, fear about taking lithium in early pregnancy, could we talk about your worries for the baby's health]
    domain: presenting-concern
    key: true
    rapport_needed: 2
    vague: It's difficult to talk about.
  - id: current-state
    content: >-
      No, I don't feel unusually high or low now. I'm sleeping seven hours and managing my usual
      routine.
    disclosure: on_direct_question
    asked_about: [mood now, sleep and daily routine now, feeling high or low recently]
    domain: presenting-concern
    key: true
  - id: risk
    content: >-
      No, I haven't been thinking of hurting myself or anyone else, and I've never attempted suicide.
    disclosure: on_direct_question
    asked_about: [suicidal thoughts, harm to yourself or others, previous suicide attempts]
    domain: presenting-concern
    key: true
  - id: postnatal
    content: >-
      I'd like to breastfeed if it's possible safely. My partner can share night care, but we haven't
      made a plan for after the birth.
    disclosure: on_direct_question
    asked_about: [breastfeeding plans, support after the birth, sharing night care]
    domain: presenting-concern
    key: true
  - id: monitoring
    content: >-
      My last lithium level was 0.7 three weeks ago; the clinic said my kidney and thyroid tests
      were normal.
    disclosure: on_direct_question
    asked_about: [last lithium level, kidney and thyroid blood tests, recent blood monitoring]
    domain: presenting-concern
    key: false
  - id: preferences
    content: >-
      Yes, I want to continue the pregnancy. Staying well enough to care for my child matters as
      much to me as avoiding harm from treatment.
    disclosure: after_rapport
    asked_about: [wishes about the pregnancy, what matters most in choosing treatment, could we talk about your priorities for you and the baby]
    domain: presenting-concern
    key: false
  - id: referral
    content: >-
      No, I haven't met a perinatal mental health team. This is my first pregnancy.
    disclosure: on_direct_question
    asked_about: [perinatal mental health team, specialist pregnancy advice so far, first pregnancy]
    domain: presenting-concern
    key: false
tasks: []
unscripted_response: I'd rather leave that for now.
deflections:
  - Can we leave that for another time?
  - I'd prefer not to go into that.
affect_stages:
  - id: starting
    affect: Anxious but seeking a joint decision.
    expression: anxious
    hesitations:
      - Mm.
  - id: engaged
    affect: More able to state priorities.
    expression: neutral
    rapport_at_least: 1
    hesitations:
      - Mm.
  - id: challenged
    affect: Feels blamed and becomes guarded.
    expression: tense
    on_confrontation: true
    hesitations:
      - Right.
questions:
  - id: question-1
    text: Who can help me weigh the choices?
    after_seconds: 300
