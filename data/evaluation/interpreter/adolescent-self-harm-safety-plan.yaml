# Author-labelled interpreter cases for a catalogue station. Held-out test split:
# written 2026-10-15 by an isolated evaluation author (Claude subagent) who saw fact
# contents but not the question labels; committed before any training lines existed.
case_id: adolescent-self-harm-safety-plan
case_version: 0.1.0
split: test
items:
  - utterance: "Hi Amelia, I'm one of the doctors from the team that sees young people in A&E. Thanks for talking to me."
    expected: []
    rapport: false
  - utterance: "Can you tell me what happened today?"
    expected: [episode]
    rapport: false
  - utterance: "Was something going on earlier today that led up to it?"
