    rapport: false
  - utterance: "That sounds like an awful lot to cope with."
    expected: []
    rapport: true
  - utterance: "Ending up in A&E after cutting deeper than before must have been really frightening for you. Is anyone, at home or anywhere else, hurting you or making you feel unsafe?"
    expected: [safeguarding]
    rapport: true
  - utterance: "How are you feeling about talking to your mum about how you're doing now?"
    expected: [sharing-concern]
    rapport: false
  - utterance: "Do you play any sports or go to any clubs after school?"
    expected: []
    rapport: false
  - utterance: "Okay, so we've got a few steps here we can build into your plan together."
    expected: []
    rapport: false
  - utterance: "And is she here with you now?"
