    rapport: false
  - utterance: "How do you notice when things are starting to build up for you? What are the first signs?"
    expected: [warning-signs]
    rapport: false
  - utterance: "When you cut, what were you hoping would happen? Did you want to end your life?"
    expected: [intent]
    rapport: false
  - utterance: "How has your mood been generally over the last few weeks, and your sleep?"
    expected: [low-mood]
    rapport: false
  - utterance: "What's helped you get through those urges in the past without hurting yourself?"
    expected: [coping]
    rapport: false
  - utterance: "Is there a grown-up you trust who you could go to if things got bad tonight?"
    expected: [trusted-adult]
    rapport: false
  - utterance: "What's at home that you could use to hurt yourself, like blades or tablets?"
