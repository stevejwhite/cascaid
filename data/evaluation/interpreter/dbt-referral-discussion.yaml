    rapport: false
  - utterance: "So would you like me to go ahead with a referral?"
    expected: [referral-preference]
    rapport: false
  - utterance: "It sounds really frightening to go from feeling fine to desperate so quickly."
    expected: []
    rapport: true
  - utterance: "That makes sense, starting over with someone new can feel exhausting."
    expected: []
    rapport: true
  - utterance: "What made you stop?"
