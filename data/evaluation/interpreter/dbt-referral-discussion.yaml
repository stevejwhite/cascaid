      interviewer: "Have you seen a counsellor before?"
      character: "Six sessions last year, then I stopped."
    expected: [previous-services]
    rapport: false
  - utterance: "and after five o'clock?"
    previous:
      interviewer: "Who do you ring in the daytime if you're struggling?"
      character: "My care coordinator."
    expected: [crisis-contact-gap]
    rapport: false
  - utterance: "How much are you drinking at the moment?"
    expected: []
    rapport: false
  - utterance: "Are you on any medication currently?"
    expected: []
    rapport: false
  - utterance: "OK, so you want a clearer idea of what's involved before you commit to anything."
    expected: []
    rapport: false
