      interviewer: "What would make you call in sick?"
      character: "Usually a presentation coming up."
    expected: [fear]
    rapport: false
  - utterance: "what's your main worry about it?"
    previous:
      interviewer: "Would weekly sessions be possible for you?"
      character: "If it's arranged around work, yes."
    expected: [commitment]
    rapport: false
  - utterance: "Does anyone in your family have anxiety?"
    expected: []
    rapport: false
  - utterance: "Do you have any physical health problems?"
    expected: []
    rapport: false
  - utterance: "So CBT would involve gradually facing those situations with support from a therapist."
    expected: []
    rapport: false
