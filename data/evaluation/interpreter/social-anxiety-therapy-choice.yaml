# Author-labelled interpreter cases for a catalogue station. Held-out test split:
# written 2026-10-15 by an isolated evaluation author (Claude subagent) who saw fact
# contents but not the question labels; committed before any training lines existed.
case_id: social-anxiety-therapy-choice
case_version: 0.1.0
split: test
items:
  - utterance: "Hello Louise, I'm one of the doctors here, nice to meet you."
    expected: []
    rapport: false
  - utterance: "What kinds of situations do you find difficult?"
    expected: [situations]
    rapport: false
  - utterance: "What goes through your mind when you're in a meeting?"
    expected: [fear]
    rapport: false
  - utterance: "What happens in your body when you get anxious?"
    expected: [body]
    rapport: false
  - utterance: "How do you cope with it day to day?"
    expected: [strategies]
    rapport: false
  - utterance: "What would you like to be different if therapy worked?"
    expected: [goals]
    rapport: false
  - utterance: "Have you had any treatment for this before?"
    expected: [help]
    rapport: false
  - utterance: "How would you feel about coming every week, and doing some homework in between?"
    expected: [commitment]
    rapport: false
  - utterance: "Have you ever had thoughts of harming yourself?"
    expected: [risk]
    rapport: false
  - utterance: "do you ever have a drink to help with the nerves"
    expected: [risk]
    rapport: false
  - utterance: "Would you rather do therapy one to one or in a group?"
    expected: [preference]
    rapport: false
