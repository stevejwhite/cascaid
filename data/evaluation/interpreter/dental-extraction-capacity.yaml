      interviewer: "What did they say about the risks?"
      character: "My mouth could be sore and bleed afterwards."
    expected: [no-treatment]
    rapport: false
  - utterance: "Do you take any medicines every day?"
    expected: []
    rapport: false
  - utterance: "Do you have any allergies?"
    expected: []
    rapport: false
  - utterance: "OK Ben, so your tooth hurts, and you don't want to be put to sleep."
    expected: []
    rapport: false
