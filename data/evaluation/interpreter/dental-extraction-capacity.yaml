# Author-labelled interpreter cases for a catalogue station. Held-out test split:
# written 2026-10-15 by an isolated evaluation author (Claude subagent) who saw fact
# contents but not the question labels; committed before any training lines existed.
case_id: dental-extraction-capacity
case_version: 0.1.0
split: test
items:
  - utterance: "Hello Ben, I'm one of the doctors, I've come to talk with you about your tooth."
    expected: []
    rapport: false
  - utterance: "What helps you understand things best when people explain them?"
    expected: [communication-needs]
    rapport: false
  - utterance: "Would you like anyone with you while we talk?"
    expected: [support-person]
    rapport: false
  - utterance: "Can you tell me what's wrong with your tooth?"
    expected: [dental-problem]
    rapport: false
  - utterance: "What have the dentists said they want to do?"
    expected: [procedure-understanding]
    rapport: false
  - utterance: "What good things might happen if the tooth comes out?"
    expected: [benefit-understanding]
    rapport: false
  - utterance: "Did they tell you about anything that could go wrong?"
    expected: [risk-understanding]
    rapport: false
  - utterance: "What do you think will happen if you leave the tooth alone?"
    expected: [no-treatment]
    rapport: false
  - utterance: "Have you tried any other way of having it done?"
