case_id: epilepsy-associated-psychosis
case_version: 0.1.0
interviews:
  - id: complete
    kind: complete
    turns:
      - {say: "Hello Sophie, I'm a doctor from the community mental health team. Come on in.", expect: []}
      - {say: "Tell me more about the private thing you mentioned.", expect: [broadcast]}
      - {say: "Are any of your thoughts not your own?", expect: [insertion]}
      - {say: "Do you ever feel like a puppet, like something outside is making you act?", expect: [passivity]}
      - {say: "Any voices?", expect: [voices]}
      - {say: "Talk me through the seizures and when these experiences started.", expect: [timing]}
      - {say: "Do you know where we are today?", expect: [orientation]}
      - {say: "Which anticonvulsant are you taking, and have you missed any doses?", expect: [treatment]}
      - {say: "Have you felt like hurting yourself or other people?", expect: [safety]}
      - {say: "Any alcohol, street drugs, or fever lately?", expect: [differential]}
      - {say: "Feeling so frightened that you need your sister with you must be really unsettling, Sophie.", expect: []}
      - {say: "What's worrying you most about all this?", expect: [fear]}
  - id: partial-no-medication-or-safety
    kind: partial
    turns:
      - {say: "Hello Sophie, have a seat.", expect: []}
      - {say: "Can other people know what you're thinking?", expect: [broadcast]}
      - {say: "um hearing voices at all", expect: [voices]}
      - {say: "How many days after the seizures did this start?", expect: [timing]}
