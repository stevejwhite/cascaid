      - {say: "Do you have any preferences about how we do future appointments, like language or who you'd see?", expect: [preferences]}
      - {say: "Do you have any concerns about who might see what you tell me?", expect: [trust]}
      - {say: "Thank you, Samira. Let's think together about what support could help.", expect: []}
