  previous:
    interviewer: What did they measure?
    character: 'They used an invented, unvalidated symptom score from zero to thirty, with lower scores
      better. Both groups averaged sixteen at baseline; follow-up completers averaged nine with the app
      and twelve with usual care at eight weeks. Recovery meant a score below five OR at least a fifty-percent
      fall from baseline: twenty-four of sixty app participants versus twelve of sixty controls, counting
      missing outcomes as not recovered. I want to distinguish improvement from full remission; the summary
      provides no confidence intervals or significance tests.'
