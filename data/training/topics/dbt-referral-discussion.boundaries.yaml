  - utterance: "How many sessions did you actually get to in the past?"
    topics: [previous-services]
    style: boundary
    pair: [attendance, previous-services]
  - utterance: "Why did you stop going to the last lot of appointments?"
    topics: [previous-services]
    style: boundary
    pair: [attendance, previous-services]
  - utterance: "um so have you been to therapy before and did you keep going"
    topics: [previous-services]
    style: boundary_spoken
    pair: [attendance, previous-services]
  - utterance: "Did you ever drop out of treatment before?"
    topics: [previous-services]
