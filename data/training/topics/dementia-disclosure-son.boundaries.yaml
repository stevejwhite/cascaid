  - utterance: "Has she said you are allowed to hear the results?"
    topics: [sharing]
    style: boundary
    pair: [mother-wishes, sharing]
  - utterance: "Did she ask you to be the one who decides what she is told?"
    topics: [sharing]
    style: boundary
    pair: [mother-wishes, sharing]
  - utterance: "um did she say it's fine for you to come to the appointments"
    topics: [sharing]
    style: boundary_spoken
    pair: [mother-wishes, sharing]
  - utterance: "Has she given you the go-ahead to be in on all this?"
