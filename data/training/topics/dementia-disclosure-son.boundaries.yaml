  - utterance: "Does she live on her own?"
    topics: []
    style: near_miss
    pair: [approach, burden]
  - utterance: "Does she have a carer who comes in?"
    topics: []
    style: near_miss
    pair: [approach, burden]

  # ---- fear / guilt ----
  - utterance: "How do you think she will react when she hears?"
    topics: [fear]
    style: boundary
    pair: [fear, guilt]
  - utterance: "Was there someone in her family who had dementia?"
    topics: [fear]
    style: boundary
    pair: [fear, guilt]
  - utterance: "um what are you scared will happen to her if she knows"
    topics: [fear]
