case_id: dementia-disclosure-son
case_version: 0.1.0
status: draft
items:
  # ---- fear / understanding ----
  - utterance: "Why are you so sure she would lose heart if she were told?"
    topics: [fear]
    style: boundary
    pair: [fear, understanding]
  - utterance: "Has anyone close to her been through dementia themselves?"
    topics: [fear]
    style: boundary
    pair: [fear, understanding]
  - utterance: "um what is it you're picturing happening if we tell her"
    topics: [fear]
    style: boundary_spoken
    pair: [fear, understanding]
  - utterance: "Do you think she'd be devastated by hearing it?"
    topics: [fear]
    style: boundary_colloquial
    pair: [fear, understanding]
  - utterance: "What is it that worries you about her hearing it?"
    topics: [fear]
    style: boundary_follow_up
    pair: [fear, understanding]
    previous:
      interviewer: "Do you think she could cope with the explanation?"
      character: "She can follow a short explanation if given time."
  - utterance: "If we explained it slowly, would she be able to take in what we say?"
    topics: [understanding]
    style: boundary
    pair: [fear, understanding]
  - utterance: "Does having dementia mean she can't make her own decisions, in your view?"
    topics: [understanding]
    style: boundary
    pair: [fear, understanding]
  - utterance: "um does she actually get what the doctors tell her"
    topics: [understanding]
    style: boundary_spoken
    pair: [fear, understanding]
  - utterance: "Can she still weigh things up for herself?"
    topics: [understanding]
    style: boundary_colloquial
    pair: [fear, understanding]
  - utterance: "And is she able to follow what is said to her?"
    topics: [understanding]
    style: boundary_follow_up
    pair: [fear, understanding]
    previous:
      interviewer: "How do you think she'd react if she knew?"
      character: "I'm afraid she'll give up."
  - utterance: "Has she ever had low mood or depression before?"
    topics: []
    style: near_miss
    pair: [fear, understanding]
  - utterance: "Has she had a memory test or a scan before this one?"
    topics: []
    style: near_miss
    pair: [fear, understanding]

