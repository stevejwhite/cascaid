# Station catalogue: definitions for a full set of CASC-style stations, from which detailed
# case files (data/cases/<id>.yaml) will be written later. Original fiction; not RCPsych
# material. Structure, proportions and coverage follow the pinned CASC Syllabus and
# Blueprint (March 2023): four complete running orders of 16 stations, each valid on its
# own, which together meet every minimum frequency in the blueprint matrix.
# services/api/tests/test_station_catalogue.py checks all of this; docs/STATION-CATALOGUE.md
# is generated from this file (npm run catalogue:doc).

blueprint:
  source_id: mrcpsych_casc
  version: "March 2023 | sha256:ae1eac93e556b3701a4aae70f1f9e784ad47ecd51ff69a0ae70631a703062a99"
  stations_per_running_order: {history: 5, examination: 5, management: 6}
  sessions:
    morning: {reading_seconds: 240, stations: {management: 6, history: 1, examination: 1}}
    afternoon: {reading_seconds: 90, stations: {history: 4, examination: 4}}
  # Minimum percentage of running orders that test each subdivision (Table 2).
  minimum_percentage:
    presenting_complaint_and_psychiatric_history: 100
    physical_health_history: 50
    developmental_history: 50
    personal_and_social_history: 50
    collateral_history: 100
    mental_state_cognitive: 75
    mental_state_psychotic: 100
    mental_state_non_psychotic: 100
    capacity_assessment: 25
    physical_examination: 50
    risk_assessment: 50
    formulation: 100
    management_biological: 100
    management_psychological: 50
    holistic_management_plan: 100
    safety_planning: 50
    legal_and_ethical_management: 100
  # Every running order includes at least one of each group.
  at_least_one_of:
    - [risk_assessment, safety_planning]
    - [mental_state_cognitive, capacity_assessment]
    - [physical_health_history, physical_examination]
  # Every running order has at least these stations per specialty (the rest are "any").
  minimum_specialty: {general: 4, child_and_adolescent: 1, intellectual_disability: 1, old_age: 1,
                      forensic: 1, medical_psychotherapy: 1, addiction: 1}
  # Each communication subdivision is the emphasis of at least one station per running order.
  communication_emphasis: [personalisation_and_respect, recognising_and_responding_to_cues,
                           empathy, providing_clear_and_accurate_information]

# Coverage the syllabus describes ("Range of clinical scenarios"); the test requires each.
coverage:
  settings: [inpatient, outpatient, emergency, general_hospital, community, criminal_justice, educational]
  age_bands: [child, adolescent, adult, older_adult]
  roles: [patient, relative, carer, colleague]
  condition_groups:
    neurodevelopmental: Neurodevelopmental disorders
    primary_psychotic: Schizophrenia or other primary psychotic disorders
    catatonia: Catatonia
    mood: Mood disorders
    anxiety_fear: Anxiety or fear-related disorders
    obsessive_compulsive: Obsessive-compulsive or related disorders
    stress_associated: Disorders specifically associated with stress
    dissociative: Dissociative disorders
    feeding_eating: Feeding or eating disorders
    elimination: Elimination disorders
    bodily_distress: Disorders of bodily distress or bodily experience
    substance_addictive: Disorders due to substance use or addictive behaviours
    impulse_control: Impulse control disorders
    disruptive_dissocial: Disruptive behaviour or dissocial disorders
    personality: Personality disorders and related traits
    paraphilic: Paraphilic disorders
    factitious: Factitious disorders
    neurocognitive: Neurocognitive disorders
    perinatal: Disorders associated with pregnancy, childbirth or the puerperium
    psychological_factors: Psychological or behavioural factors affecting other conditions
    secondary_syndromes: Secondary mental or behavioural syndromes
    sleep_wake: Sleep-wake disorders
    sexual_dysfunction: Sexual dysfunctions
    gender_incongruence: Gender incongruence

# Each station: code (running order + number), session, blueprint slot, communication
# emphasis, setting, who the candidate meets (and the patient's age band when that is
# someone else), condition group, a one-line scenario, the
# candidate's task, the areas its hidden facts should cover, and the existing case it maps
# to, if any. simulator: physical_examination marks stations the current voice simulator
# cannot yet run (the candidate must examine; findings need a new mechanism).
