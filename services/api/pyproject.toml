[project]
name = "psychiatry-edu-api"
version = "0.2.0"
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic>=2",
  "pydantic-settings",
  "PyYAML",
  "httpx",
  "jsonschema",
  "scikit-learn>=1.9.1",
  "numpy>=2.5.4",
  "pyjwt[crypto]>=2.10",
  "ruamel-yaml>=0.18",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/psychiatry_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
